services:
  - type: web
    name: wavesight-sih26147
    runtime: python
    plan: free
    autoDeploy: true
    numInstances: 1
    # Upgrade pip first so wheel discovery works on the enforced Python;
    # --prefer-binary never falls back to meson source builds (g95 error).
    buildCommand: pip install --upgrade pip && pip install --prefer-binary -r requirements.txt
    # Render injects $PORT — the app must bind to it fast (landing at /,
    # console at /app). Single worker fits the 512MB free tier; keep-alive
    # keeps the uptime monitor's connections warm.
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 75 --log-level info
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: MPLBACKEND
        value: Agg
      - key: PYTHONUNBUFFERED
        value: 1
      - key: OMP_NUM_THREADS
        value: 1
      - key: OPENBLAS_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: NUMEXPR_NUM_THREADS
        value: 1
