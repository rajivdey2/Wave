services:
  - type: web
    name: wavesight-sih26147
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT — the app must bind to it (landing at /, console at /app)
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
